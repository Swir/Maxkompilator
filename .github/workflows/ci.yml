name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install -c constraints-ci.txt .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Check measurable roadmap
        run: python scripts/update_progress.py --check
      - name: Build and run a real PYZ
        run: python -m maxkompilator build examples/hello-python --format zipapp --smoke-test --json

  native-python:
    name: Native Python / ${{ matrix.os }}
    needs: core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the native builder
        run: python -m pip install -c constraints-ci.txt ".[freeze]"
      - name: Build and run native example with a resource
        run: python -m maxkompilator build examples/hello-python --format executable --smoke-test --json
      - name: Qualify runtime and checksum
        run: python scripts/qualify_native.py examples/hello-python/dist/maxkompilator/build-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-example-${{ matrix.os }}
          path: |
            examples/hello-python/dist/maxkompilator/native-example-*.tar.gz
            examples/hello-python/dist/maxkompilator/build-report.json
            examples/hello-python/dist/maxkompilator/native-qualification.json
          if-no-files-found: error
          retention-days: 14

  desktop-windows:
    name: Windows desktop bundle
    needs: core
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install GUI and build dependencies
        run: python -m pip install -c constraints-ci.txt ".[gui,freeze]" build
      - name: Exercise actual GUI and CLI processes
        run: python scripts/gui_smoke.py --screenshot build/gui-smoke.png --report build/gui-smoke.json
      - name: Build the Windows application and console worker
        run: python scripts/build_windows.py
      - name: Check packaged worker
        run: .\dist\Maxkompilator\MaxkompilatorCLI.exe --cli inspect .\examples\hello-python --json
      - name: Build and run PYZ through packaged worker
        run: .\dist\Maxkompilator\MaxkompilatorCLI.exe --cli build .\examples\hello-python --format zipapp --smoke-test --json
      - name: Qualify the packaged Windows GUI and reopen it
        run: python scripts/qualify_windows_gui.py dist/Maxkompilator/Maxkompilator.exe --output build/packaged-gui
      - name: Upload packaged GUI qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Maxkompilator-Windows-GUI-qualification
          path: build/packaged-gui/
          if-no-files-found: warn
          retention-days: 14
      - name: Build source and wheel distributions
        run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Maxkompilator-Windows-x64
          path: |
            dist/Maxkompilator/
            dist/*.whl
            dist/*.tar.gz
            build/gui-smoke.png
            build/gui-smoke.json
            build/packaged-gui/
          if-no-files-found: error
          retention-days: 14

  dotnet-native:
    name: Real .NET publish and runtime / ${{ matrix.os }}
    needs: core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Maxkompilator
        run: python -m pip install -c constraints-ci.txt .
      - name: Real self-contained .NET publish and execution from outside the source tree
        run: python -m maxkompilator build examples/hello-dotnet --kind dotnet --target native --format directory --smoke-test --json
      - name: Qualify .NET host, architecture, resource, checksums and runtime files
        run: python scripts/qualify_dotnet.py examples/hello-dotnet/dist/maxkompilator/build-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dotnet-runtime-evidence-${{ matrix.os }}
          path: |
            examples/hello-dotnet/dist/maxkompilator/build-report.json
            examples/hello-dotnet/dist/maxkompilator/dotnet-qualification.json
          if-no-files-found: error
          retention-days: 14

  android-debug:
    name: Real Android APK and AAB
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the example SDK and Maxkompilator
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          python -m pip install -c constraints-ci.txt .
      - name: Build and verify real debug APK
        run: python -m maxkompilator build examples/hello-android --kind android --target android --format apk --json
      - name: Build and inspect real debug AAB signing
        run: python -m maxkompilator build examples/hello-android --kind android --target android --format aab --output dist/aab --json
      - name: Download pinned bundletool and verify its checksum
        run: |
          mkdir -p build/tools
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o build/tools/bundletool.jar
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  build/tools/bundletool.jar" | sha256sum --check
      - name: Independently validate the bundle and compare its decoded manifest
        run: >-
          python scripts/qualify_android.py
          --apk-report examples/hello-android/dist/maxkompilator/build-report.json
          --aab-report examples/hello-android/dist/aab/build-report.json
          --bundletool build/tools/bundletool.jar
          --output build/android-qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-debug-evidence
          path: |
            examples/hello-android/dist/maxkompilator/build-report.json
            examples/hello-android/dist/maxkompilator/artifacts/
            examples/hello-android/dist/aab/build-report.json
            examples/hello-android/dist/aab/artifacts/
            build/android-qualification.json
          if-no-files-found: warn
          retention-days: 14

  windows-profiles:
    name: Windows profiles and Python-free runtime
    needs: core
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      SOURCE_DATE_EPOCH: '1792252800'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned native tools
        run: python -m pip install -c constraints-ci.txt ".[freeze]" pefile==2024.8.26
      - name: Build the selected profile twice
        run: |
          python -m maxkompilator build examples/hello-python-native --smoke-test --output dist/first --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m maxkompilator build examples/hello-python-native --smoke-test --output dist/second --json
      - name: Inspect actual PE version and icon resources and compare every payload hash
        run: python scripts/qualify_windows_profile.py examples/hello-python-native/dist/first/build-report.json --second examples/hello-python-native/dist/second/build-report.json --output build/profile-qualification.json
      - name: Build and execute an actual WinForms window with its own runtime
        run: python -m maxkompilator build examples/hello-desktop --smoke-test --json
      - name: Verify desktop dependencies and profile metadata
        run: python scripts/qualify_windows_profile.py examples/hello-desktop/dist/maxkompilator/build-report.json --desktop --output build/desktop-qualification.json
      - name: Run the EXE twice in an independent Python-free Windows filesystem
        run: |
          $ErrorActionPreference = 'Stop'
          $inputRoot = Join-Path $env:RUNNER_TEMP 'python-free-input'
          $resultRoot = Join-Path $env:GITHUB_WORKSPACE 'build/python-free'
          New-Item -ItemType Directory -Path $inputRoot,$resultRoot -Force | Out-Null
          $report = Get-Content examples/hello-python-native/dist/first/build-report.json -Raw | ConvertFrom-Json
          $binary = ($report.artifacts | Where-Object { $_.path -like '*SwirProfileDemo.exe' }).path
          Copy-Item -LiteralPath (Split-Path $binary) -Destination (Join-Path $inputRoot 'Application') -Recurse
          Copy-Item -LiteralPath scripts/qualify_python_free_windows.ps1 -Destination (Join-Path $inputRoot 'qualify.ps1')
          $baseImage = 'mcr.microsoft.com/windows/servercore:ltsc2022'
          docker pull $baseImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker image inspect $baseImage | Set-Content (Join-Path $resultRoot 'container-image.json')
          docker run --rm --network none --isolation process --mount "type=bind,source=$inputRoot,target=C:\Inputs,readonly" --mount "type=bind,source=$resultRoot,target=C:\Results" $baseImage powershell.exe -NoLogo -NoProfile -File C:\Inputs\qualify.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qualification = Get-Content (Join-Path $resultRoot 'python-free-windows.json') -Raw | ConvertFrom-Json
          if ($qualification.status -ne 'passed' -or $qualification.pythonInstalled) { throw 'Python-free qualification did not pass' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-profile-qualification
          path: |
            build/profile-qualification.json
            build/desktop-qualification.json
            build/python-free/
            examples/hello-python-native/dist/first/build-report.json
            examples/hello-python-native/dist/second/build-report.json
            examples/hello-desktop/dist/maxkompilator/build-report.json
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Mandatory release qualification
    if: always()
    needs: [core, native-python, desktop-windows, dotnet-native, android-debug, windows-profiles]
    runs-on: ubuntu-latest
    steps:
      - name: Require all qualification groups to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; jobs=json.loads(os.environ["RESULTS"]); failed=[key for key,value in jobs.items() if value["result"]!="success"]; print(jobs); assert not failed, failed'
